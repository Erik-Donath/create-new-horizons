name: Export and Attach Modrinth Modpack

on:
  release:
    types: [created]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh pack
        run: packwiz refresh

      - name: Export to Modrinth (.mrpack)
        run: packwiz modrinth export

      - name: Upload .mrpack to release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.mrpack"
      
      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          FILE=$(ls *.mrpack)

          curl -X POST https://api.modrinth.com/v2/version \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "User-Agent: Erik-Donath/Create-New-Horizons" \
            -F "data={
              \"name\":\"${{ github.ref_name }}\",
              \"version_number\":\"${{ github.ref_name }}\",
              \"project_id\":\"${{ secrets.MODRINTH_PROJECT_ID }}\",
              \"game_versions\":[\"1.21.1\"],
              \"loaders\":[\"neoforge\"],
              \"featured\":true,
              \"version_type\":\"release\",
              \"status\":\"listed\"
            }" \
            -F "file=@${FILE}"

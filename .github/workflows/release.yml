name: Export and Attach Modrinth Modpack

on:
  release:
    types: [created]

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh pack
        run: packwiz refresh

      - name: Export to Modrinth (.mrpack)
        run: packwiz modrinth export

      - name: Upload .mrpack to release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.mrpack"
